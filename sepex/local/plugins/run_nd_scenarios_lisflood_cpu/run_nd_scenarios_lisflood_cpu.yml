info:
  version: '0.1.0'
  id: runNdScenariosLisfloodCpu
  title: Run ND Scenarios (LISFLOOD, CPU)
  description: Run normal-depth scenarios for a reach using adaptive discharge stepping
  jobControlOptions:
    - async-execute
  outputTransmission:
    - reference

host:
  type: docker
  image: run_nd_scenarios-lisflood-cpu:local

command: []

config:
  maxResources:
    cpus: 3
    memory: 2048
  envVars:
    - RUNNDSCENARIOSLISFLOODCPU_AWS_ENDPOINT_URL
    - RUNNDSCENARIOSLISFLOODCPU_AWS_ACCESS_KEY_ID
    - RUNNDSCENARIOSLISFLOODCPU_AWS_SECRET_ACCESS_KEY
    - RUNNDSCENARIOSLISFLOODCPU_AWS_DEFAULT_REGION
    - RUNNDSCENARIOSLISFLOODCPU_AWS_S3_ENDPOINT
    - RUNNDSCENARIOSLISFLOODCPU_AWS_VIRTUAL_HOSTING
    - RUNNDSCENARIOSLISFLOODCPU_AWS_HTTPS

inputs:
  - id: model_manifest_path
    title: model_manifest_path
    description: S3 path to the model manifest JSON from build_model
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 1
    maxOccurs: 1

  - id: model_results_base_path
    title: model_results_base_path
    description: S3 path where scenario results will be saved
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 1
    maxOccurs: 1

  - id: min_upstream_inflow
    title: min_upstream_inflow
    description: Minimum discharge in cms
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 1
    maxOccurs: 1

  - id: max_upstream_inflow
    title: max_upstream_inflow
    description: Maximum discharge in cms
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 1
    maxOccurs: 1

  - id: delta_upstream_inflow
    title: delta_upstream_inflow
    description: Discharge increment for adaptive step algorithm in cms
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 1
    maxOccurs: 1

  - id: outflow_area_polygon_path
    title: outflow_area_polygon_path
    description: S3 path to the outflow area polygon; derived by the job when omitted
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 1

  - id: volume_convergence_tolerance
    title: volume_convergence_tolerance
    description: Volume convergence threshold for adaptive stepping
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 1

  - id: allow_water_on_edges
    title: allow_water_on_edges
    description: Whether to allow water at domain edges
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 1

  - id: existing_scenarios
    title: existing_scenarios
    description: >-
      Scenario manifests already published under this reach's run identity. The
      job reads their metrics instead of re-simulating those discharges, and
      re-judges them against the bands in force now.

      maxOccurs is the LIBRARY SIZE, not one. SEPEX counts the elements of a
      JSON array as occurrences, so a low bound rejects any reach that has been
      swept more than a handful of times.
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 10000

  - id: q_grid_resolution
    title: q_grid_resolution
    description: >-
      Discharge grid every scenario must land on, whole cms, anchored to zero.
      It is the finest step the sweep may take, so a step between two adjacent
      grid values is one nothing could improve on -- which is what lets the loop
      tell an unavoidable step from a stretch the sweep skipped.
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 1

  - id: ld_q_max_depth_increase_range
    title: ld_q_max_depth_increase_range
    description: >-
      [min, max] increase in max depth, in metres, between consecutive
      discharge scenarios. Below min the step was too small and grows, above
      max it was too large and shrinks.

      maxOccurs is 2 because the value is a two-element JSON array and SEPEX
      counts array elements as occurrences, so a bound of 1 rejects the range.
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 2

  - id: ld_q_median_depth_increase_range
    title: ld_q_median_depth_increase_range
    description: >-
      [min, max] increase in median depth, in metres, between consecutive
      discharge scenarios.
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 2

  - id: ld_q_flooded_area_prcnt_increase_range
    title: ld_q_flooded_area_prcnt_increase_range
    description: >-
      [min, max] percent increase in inundated area between consecutive
      discharge scenarios, where 10 means 10 percent.
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 2

outputs:
  - id: plugin_results
    title: plugin_results
    description: Adaptive step comparison results and job warnings
    output:
      transmissionMode:
        - reference
