[project]
name = "orchestrator"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.9",
    "dagster-aws",
    "dagster-postgres",
    "dagster-webserver",
    "boto3>=1.34",
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "shapely>=2.1.2",
    # scripts/seed.py reads the hydrofabric GeoPackages and writes the reach
    # network as GeoParquet. geopandas was already being imported without being
    # declared; pyarrow is what its to_parquet writer needs, and what lets the
    # writer control row groups and record the sort order.
    "geopandas>=1.0",
    "pyarrow>=15",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "geopandas>=1.1.4",
    "matplotlib>=3.10",
    "ipykernel>=7.3.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recon", "dagster_app"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_app"
registry_modules = [
    "dagster_app.components.*",
]
