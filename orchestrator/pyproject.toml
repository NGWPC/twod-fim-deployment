[project]
name = "orchestrator"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.9",
    "dagster-aws",
    "dagster-postgres",
    "dagster-webserver",
    "boto3>=1.34",
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestrator"
registry_modules = [
    "orchestrator.components.*",
]
