[project]
name = "orchestrator"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "shapely>=2.1.2",
    # scripts/seed.py reads the hydrofabric GeoPackages and writes the reach
    # network as GeoParquet. geopandas was already being imported without being
    # declared; pyarrow is what its to_parquet writer needs, and what lets the
    # writer control row groups and record the sort order.
    "geopandas>=1.0",
    "pyarrow>=15",
]

[dependency-groups]
dev = [
    "geopandas>=1.1.4",
    "matplotlib>=3.10",
    "ipykernel>=7.3.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recon"]
force-include = { "pyproject.toml" = "pyproject.toml" }

