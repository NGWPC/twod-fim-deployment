storage:
  postgres:
    postgres_db:
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      port:
        env: DAGSTER_PG_PORT

run_queue:
  max_concurrent_runs: 10

run_retries:
  enabled: true
  max_retries: 3
  retry_on_asset_or_op_failure: false

run_monitoring:
  enabled: true
  poll_interval_seconds: 60

compute_logs:
  module: dagster_aws.s3.compute_log_manager
  class: S3ComputeLogManager
  config:
    bucket:
      env: DAGSTER_S3_BUCKET
    prefix: "dagster-logs/"
    # No endpoint_url: boto3 reads AWS_ENDPOINT_URL itself when it is set (MinIO
    # locally), and resolves the endpoint per bucket when it is not. Naming the
    # variable here would make it mandatory - dagster's `env:` fails to load when
    # it is unset - which is exactly the state real-S3 deployments need.
    upload_interval: 30

telemetry:
  enabled: false
