services:
  db:
    image: postgis/postgis:16-3.4
    container_name: twodfim-db
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Auto-apply the schema on first boot. README.md and child folders are ignored (only *.sql/*.sh run).
      - ./db/schema:/docker-entrypoint-initdb.d:ro
      - ./.data/db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twodfim} -d ${POSTGRES_DB:-twodfim}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: twodfim-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minio123}
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: twodfim-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$AWS_ACCESS_KEY_ID $$AWS_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$DAGSTER_S3_BUCKET &&
      mc mb --ignore-existing local/$$ARTIFACTS_S3_BUCKET &&
      echo 'Buckets ready.'
      "

  orchestrator:
    build:
      context: ./orchestrator
    container_name: twodfim-orchestrator
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      AWS_ENDPOINT_URL: http://minio:9000
      DAGSTER_HOME: /opt/dagster
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: [ "dagster", "dev", "-h", "0.0.0.0", "-p", "3000", "-m", "orchestrator.definitions" ]
    ports:
      - "3000:3000"
    healthcheck:
      disable: true

networks:
  default:
    name: twodfim
